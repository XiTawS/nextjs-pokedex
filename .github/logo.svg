<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Pokédex">
  <defs>
    <clipPath id="cadre"><rect width="1200" height="360" rx="32"/></clipPath>
    <pattern id="trame" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="9" r="2.2" fill="#d2232f"/>
    </pattern>
    <linearGradient id="fondu" x1="0" x2="1">
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.55"/>
    </linearGradient>
    <mask id="masque"><rect width="1200" height="360" fill="url(#fondu)"/></mask>
  </defs>
  <g clip-path="url(#cadre)">
    <rect width="1200" height="360" fill="#0a0a0a"/>
    <!-- Trame de points, comme le pied de page du site -->
    <rect width="1200" height="360" fill="url(#trame)" mask="url(#masque)"/>
    <!-- Poké Ball en filigrane -->
    <g fill="none" stroke="#d2232f" stroke-opacity="0.3" stroke-width="22">
      <circle cx="1120" cy="310" r="250"/>
      <path d="M870 310h500"/>
      <circle cx="1120" cy="310" r="70"/>
    </g>
  </g>
  <!-- Poké Ball -->
  <g transform="translate(190 180)">
    <circle r="108" fill="#fff"/>
    <path d="M-108 0a108 108 0 0 1 216 0z" fill="#d2232f"/>
    <rect x="-108" y="-9" width="216" height="18" fill="#0a0a0a"/>
    <circle r="36" fill="#fff" stroke="#0a0a0a" stroke-width="16"/>
    <circle r="14" fill="#fff" stroke="#d1d5db" stroke-width="5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="350" y="196" font-size="124" font-weight="800" fill="#fff" letter-spacing="-3">Pokédex</text>
    <text x="354" y="258" font-size="34" fill="#a3a3a3">Les 1 025 Pokémon, de Bulbizarre à Pêchaminus</text>
  </g>
</svg>
